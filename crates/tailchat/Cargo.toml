[package]
name = "tailchat"
description = "Minimal, moddable voice + text chat over Tailscale"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gui", "voice"]
gui = ["dep:tailchat-gui"]
voice = ["tailchat-core/voice", "tailchat-gui?/voice"]

[dependencies]
tailchat-core.workspace = true
tailchat-gui = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
chrono.workspace = true
