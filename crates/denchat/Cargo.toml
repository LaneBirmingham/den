[package]
name = "denchat"
description = "Minimal, moddable peer-to-peer voice + text chat"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "den"
path = "src/main.rs"

[features]
default = ["gui", "voice"]
gui = ["dep:denchat-gui"]
voice = ["denchat-core/voice", "denchat-gui?/voice"]

[dependencies]
denchat-core.workspace = true
denchat-gui = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
chrono.workspace = true
