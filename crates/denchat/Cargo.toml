[package]
name = "denchat"
description = "Minimal, moddable peer-to-peer voice + text chat"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "den"
path = "src/main.rs"

[features]
default = ["gui", "voice"]
gui = ["dep:denchat-gui"]
voice = ["denchat-core/voice", "denchat-gui?/voice"]

[dependencies]
denchat-core.workspace = true
denchat-gui = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
chrono.workspace = true

[target.'cfg(unix)'.dependencies]
# `den status | head` should end quietly, not panic on the closed pipe.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Leave the console window Windows opens when the app is started from Explorer,
# turn on colour in the console, and let an already-running app take the foreground.
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
