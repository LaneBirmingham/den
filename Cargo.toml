[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/denchat"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LaneBirmingham/den"
rust-version = "1.91"

[workspace.dependencies]
denchat-proto = { path = "crates/denchat-proto" }
denchat-core = { path = "crates/denchat-core" }
denchat-audio = { path = "crates/denchat-audio" }
denchat-gui = { path = "crates/denchat-gui" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs", "signal", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
parking_lot = "0.12"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
crossbeam-channel = "0.5"
# clipboard: system copy/paste (without it egui keeps a private, in-app clipboard). links: open URLs.
# system_fonts: fall back to OS fonts for scripts the bundled fonts lack (CJK, Arabic, emoji, …).
# wgpu, not glow: windowed OpenGL on Windows queues frames in the driver, so hover
# and clicks trail the cursor; wgpu (DX12 / Vulkan / Metal) presents with a one-frame queue.
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "wgpu", "links", "persistence", "system_fonts", "wayland", "x11"] }
egui = "0.37"
cpal = "0.18"
opus = "0.4"
# unstable-net-report: the NAT facts behind `Net::reach` (not semver-covered; re-check on upgrades).
iroh = { version = "1.4", features = ["unstable-net-report"] }
iroh-relay = { version = "1.4", default-features = false, features = ["server"] }
data-encoding = "2"
# Same version iroh uses; only to ask the router whether it maps ports (`Net::reach`).
portmapper = "0.19"
bytes = "1"
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.18"

# Optimise dependencies even in dev builds: unoptimised egui tessellation, opus
# and crypto eat most of a 144-240 Hz frame budget. Den's own crates stay
# quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
