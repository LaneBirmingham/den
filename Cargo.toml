[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/tailchat"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://gitea.birmosserver.com/BobLobster/tail-chat"
rust-version = "1.91"

[workspace.dependencies]
tailchat-proto = { path = "crates/tailchat-proto" }
tailchat-core = { path = "crates/tailchat-core" }
tailchat-audio = { path = "crates/tailchat-audio" }
tailchat-gui = { path = "crates/tailchat-gui" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs", "signal", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
parking_lot = "0.12"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
crossbeam-channel = "0.5"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.37"
cpal = "0.18"
opus = "0.4"
iroh = "1.4"
iroh-relay = { version = "1.4", default-features = false, features = ["server"] }
data-encoding = "2"
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
