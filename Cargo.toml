[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/denchat"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://gitea.birmosserver.com/BobLobster/den"
rust-version = "1.91"

[workspace.dependencies]
denchat-proto = { path = "crates/denchat-proto" }
denchat-core = { path = "crates/denchat-core" }
denchat-audio = { path = "crates/denchat-audio" }
denchat-gui = { path = "crates/denchat-gui" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs", "signal", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
parking_lot = "0.12"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
crossbeam-channel = "0.5"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.37"
cpal = "0.18"
opus = "0.4"
# unstable-net-report: the NAT facts behind `Net::reach` (not semver-covered; re-check on upgrades).
iroh = { version = "1.4", features = ["unstable-net-report"] }
iroh-relay = { version = "1.4", default-features = false, features = ["server"] }
data-encoding = "2"
# Same version iroh uses; only to ask the router whether it maps ports (`Net::reach`).
portmapper = "0.19"
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
